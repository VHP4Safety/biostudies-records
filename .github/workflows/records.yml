name: records

on:
  push:
    paths: ["bs_records/**", "template/**", "bsmeta.py", "tracker.json", "tracker.gs", "tests/**", ".github/workflows/records.yml"]
  pull_request:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:
    inputs:
      submit:
        description: "Resubmit every bs_records/S-VHPS*.json to BioStudies"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q
      - run: python bsmeta.py fmt --check bs_records/*.json template/TEMPLATE.pagetab.json tracker.json
      - run: python bsmeta.py check-terms bs_records/*.json

  fresh:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.submit)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python bsmeta.py check-links bs_records/*.json
      - if: ${{ !cancelled() }}
        run: python bsmeta.py check-sheet bs_records/S-VHPS*.json
      - if: ${{ !cancelled() }}
        run: python bsmeta.py diff bs_records/S-VHPS*.json

  submit:
    if: github.event_name == 'workflow_dispatch' && inputs.submit
    needs: check
    runs-on: ubuntu-latest
    environment: biostudies
    env:
      BIOSTUDIES_LOGIN: ${{ secrets.BIOSTUDIES_LOGIN }}
      BIOSTUDIES_PASSWORD: ${{ secrets.BIOSTUDIES_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python bsmeta.py submit bs_records/S-VHPS*.json
      - run: sleep 120 && python bsmeta.py diff bs_records/S-VHPS*.json
