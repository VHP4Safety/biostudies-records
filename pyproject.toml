[project]
name = "bsmeta"
version = "0.1.0"
description = "Validator/linter for VHP4Safety BioStudies PageTab metadata records"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic2-schemaorg>=0.3.0",
    "sqlmodel>=0.0.22",
]

[project.scripts]
bsmeta = "bsmeta.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bsmeta"]

[tool.uv]
# Never fall back to conda/system Python — always use a uv-managed interpreter.
python-preference = "only-managed"
